<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ecoxchange_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ecoxchange_mobile</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS SDK for the web build of the Customer tracking map
       (google_maps_flutter web plugin). Reuses the existing, referrer-
       restricted GOOGLE_MAPS_API_KEY -- browser Maps keys are designed to
       be client-embedded (protected by HTTP-referrer restriction, not
       secrecy), unlike the server-side Routes API key. If this key's
       referrer allowlist doesn't include localhost, map tiles may not
       render, but this has no effect on the tracking data itself
       (distance/ETA/freshness/coordinates), which never goes through
       Maps JS. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA7ZCOnqHgx7UcAgc7UaNJdjBv2vnzFxRM" async></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
