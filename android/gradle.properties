org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true

# A machine whose antivirus intercepts HTTPS (e.g. Avast) may need a custom
# JDK trust store for Gradle downloads. Configure that per machine in
# ~/.gradle/gradle.properties (javax.net.ssl.trustStore /
# trustStorePassword), never in this tracked file.
#
# -Xmx3G (plus a worker cap) keeps the Gradle daemon within the free RAM of
# the development machine; an earlier -Xmx8G got the daemon killed
# mid-build. Raise it on a machine with more headroom if builds are slow.
